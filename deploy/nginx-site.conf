# Shape to Equations behind host nginx with https on port 7777.
# Install as /etc/nginx/sites-available/shape-to-equations and link it into sites-enabled.
# The container must be published on 127.0.0.1:7780 (BIND=127.0.0.1:7780 in .env).
server {
    listen 7777 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/dse-webapp.crt;
    ssl_certificate_key /etc/nginx/ssl/dse-webapp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Plain http sent to this port is redirected to https on the same port.
    error_page 497 =301 https://$http_host$request_uri;

    client_max_body_size 64k;

    location / {
        proxy_pass         http://127.0.0.1:7780;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host $http_host;
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
    }
}
